[package]
name = "neslink-nes"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tetanes-core = "0.17.0"
wasm-bindgen = "0.2"

# tetanes-core pulls in rand; on wasm32 getrandom needs an explicit JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
