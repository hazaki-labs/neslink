name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes the review still running for the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets on a public repository, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # The plugin's first step asks a small model whether Claude has already
      # commented, and it sometimes imagines a comment that isn't there and
      # skips the review. Check with the API instead: skip when Claude has
      # commented (the plugin would too), otherwise tell the plugin there is none.
      - name: Check for an earlier Claude review
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count=$(
            {
              gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[] | select(.user.login == "claude[bot]") | .id'
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --jq '.[] | select(.user.login == "claude[bot]") | .id'
            } | wc -l
          )
          echo "Earlier Claude comments: $count"
          echo "reviewed=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.prior.outputs.reviewed == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Note from the workflow: the GitHub API shows no comments or review comments by Claude
            on this pull request, so the "Claude has already commented" condition in step 1 is false.
            Pass this on to the step 1 agent.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
